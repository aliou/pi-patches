name: Patches

on:
  push:
    branches: [main]
    paths:
      - "*/README.md"
      - "*/patch.diff"
      - "*/patch.test.mjs"
      - "manifest.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/sync-patches.mjs"
      - "scripts/bump-pi-version.mjs"
      - ".github/workflows/patches.yml"
  pull_request:
    paths:
      - "*/README.md"
      - "*/patch.diff"
      - "*/patch.test.mjs"
      - "manifest.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/sync-patches.mjs"
      - "scripts/bump-pi-version.mjs"
      - ".github/workflows/patches.yml"
  schedule:
    # Twice daily at 08:00 and 20:00 UTC.
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    # Manual run. Inputs drive the test-patches-latest job.
    inputs:
      pi-version:
        description: "pi version to test against (empty = each package's latest published)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test patches against the pi versions pinned in package.json.
  # `pnpm install` applies the patches via pnpm `patchedDependencies`;
  # the tests import the patched packages by name.
  test-patches:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: patch-node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            patch-node-modules-${{ runner.os }}-

      - name: Generate combined patch files
        run: node scripts/sync-patches.mjs

      - name: Install patch project
        run: pnpm install --frozen-lockfile

      - name: Run patch tests
        run: pnpm test:patches

  # Test patches against the latest published pi release (nightly), or against a
  # specific version via workflow_dispatch input. Bumps package.json
  # (ephemeral, not committed), reinstalls, then runs the patch tests. If a patch
  # no longer applies to the new version, `pnpm install` fails and the job goes
  # red — the signal to rebase the patch.
  test-patches-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: patch-node-modules-latest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.inputs.pi-version }}
          restore-keys: |
            patch-node-modules-latest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            patch-node-modules-${{ runner.os }}-

      - name: Bump pi to target version
        env:
          PI_VERSION: ${{ github.event.inputs.pi-version }}
        run: node scripts/bump-pi-version.mjs

      - name: Generate combined patch files
        run: node scripts/sync-patches.mjs

      - name: Install patch project at bumped version
        run: pnpm install --no-frozen-lockfile

      - name: Run patch tests
        run: pnpm test:patches

  # Build upstream Pi from main, apply this repo's patch diffs to the built
  # package output, then run the same patch assertions against those local
  # packages. This catches patches that no longer apply before a release is cut.
  test-patches-upstream-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: earendil-works/pi
          ref: main
          path: upstream-pi

      - name: Read upstream commit
        id: upstream
        working-directory: upstream-pi
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: upstream-npm-${{ runner.os }}-${{ hashFiles('upstream-pi/package-lock.json') }}
          restore-keys: |
            upstream-npm-${{ runner.os }}-

      # Restore/save are split: `actions/cache` saves in a post step, which
      # would run *after* the patch steps below modify `packages/*/dist` and
      # cache the patched build. The next run would then restore an
      # already-patched dist and fail with "previously applied patch".
      - uses: actions/cache/restore@v6
        id: upstream-build-cache
        with:
          path: |
            upstream-pi/node_modules
            upstream-pi/packages/*/dist
            upstream-pi/packages/session-backends/*/dist
          key: upstream-build-v2-${{ runner.os }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('upstream-pi/package-lock.json') }}
          restore-keys: |
            upstream-build-v2-${{ runner.os }}-${{ steps.upstream.outputs.sha }}-

      - name: Generate combined patch files
        run: node scripts/sync-patches.mjs

      - name: Build upstream Pi main
        if: steps.upstream-build-cache.outputs.cache-hit != 'true'
        working-directory: upstream-pi
        run: |
          npm ci --prefer-offline
          npm run build

      # Save the pristine build before any patch step can modify it.
      - uses: actions/cache/save@v6
        if: steps.upstream-build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            upstream-pi/node_modules
            upstream-pi/packages/*/dist
            upstream-pi/packages/session-backends/*/dist
          key: upstream-build-v2-${{ runner.os }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('upstream-pi/package-lock.json') }}

      - name: Apply patches to upstream build
        run: |
          patch --directory upstream-pi/packages/coding-agent --forward --strip=1 < combined/pi-coding-agent.diff
          patch --directory upstream-pi/packages/tui --forward --strip=1 < combined/pi-tui.diff

      - name: Install patch project
        run: pnpm install --no-frozen-lockfile

      - name: Link patched upstream packages
        run: |
          rm -rf node_modules/@earendil-works
          mkdir -p node_modules/@earendil-works
          ln -s ../../upstream-pi/packages/ai node_modules/@earendil-works/pi-ai
          ln -s ../../upstream-pi/packages/coding-agent node_modules/@earendil-works/pi-coding-agent
          ln -s ../../upstream-pi/packages/tui node_modules/@earendil-works/pi-tui

      - name: Run patch tests against upstream main
        run: pnpm test:patches
